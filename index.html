<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#7c3aed">
<title>WASTED MODS</title>
<meta name="description" content="Mods for People Playground. Pick a file and download it.">
<meta property="og:title" content="WASTED MODS">
<meta property="og:description" content="Mods for People Playground. Pick a file and download it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:#0b0810;
  --panel:#14101d;
  --panel-2:#1b1528;
  --line:#2c2340;
  --line-2:#3b2e57;
  --text:#ece8f6;
  --muted:#9d93b8;
  --violet:#7c3aed;
  --violet-hi:#8f57f5;
  --glow:#c4a8ff;
  --ok:#4ade80;
  --display:"Syne","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{
  margin:0;
  min-height:100vh;
  font:16px/1.55 var(--body);
  color:var(--text);
  background:
    radial-gradient(900px 480px at 12% -8%,rgba(124,58,237,.30),transparent 62%),
    var(--void);
  background-repeat:no-repeat;
  padding:0 20px 72px;
}
.wrap{max-width:860px;margin:0 auto}
.bar{display:flex;justify-content:flex-end;padding-top:22px}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel)}
.lang button{
  appearance:none;border:0;margin:0;
  padding:8px 15px;
  background:transparent;
  color:var(--muted);
  font:600 13px/1 var(--body);
  letter-spacing:.02em;
  cursor:pointer;
}
.lang button + button{border-left:1px solid var(--line-2)}
.lang button:hover{color:var(--text)}
.lang button[aria-pressed="true"]{background:var(--violet);color:#fff}
.lang button:focus-visible{outline:2px solid var(--glow);outline-offset:-2px}
header{padding:64px 0 40px}
h1{
  margin:0 0 20px;
  font:800 clamp(44px,11vw,96px)/.92 var(--display);
  letter-spacing:-.035em;
  text-shadow:0 0 42px rgba(124,58,237,.55);
}
.lead{margin:0;max-width:46ch;color:var(--muted);font-size:18px}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(0,1fr));
  margin:0 0 48px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.stat{padding:20px 22px 20px 0}
.stat + .stat{padding-left:22px;border-left:1px solid var(--line)}
.stat b{
  display:block;
  font:700 clamp(28px,6vw,46px)/1.05 var(--display);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.stat span{color:var(--muted);font-size:14px}
.tools{margin:0 0 18px}
.tools input{
  width:100%;
  padding:12px 16px;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line-2);
  border-radius:10px;
  font:500 15px/1.2 var(--body);
}
.tools input::placeholder{color:var(--muted)}
.tools input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.release{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:18px;
  overflow:hidden;
}
.release-head{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 14px;
  padding:20px 22px 0;
}
.release-head h2{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.01em}
.release-head time{color:var(--muted);font-size:14px}
.badge{
  font-size:13px;
  font-weight:600;
  padding:2px 10px;
  border-radius:999px;
  background:rgba(124,58,237,.2);
  color:var(--glow);
  border:1px solid rgba(196,168,255,.28);
}
.notes{
  margin:12px 22px 0;
  white-space:pre-wrap;
  color:var(--muted);
  font-size:15px;
  max-width:66ch;
}
.files{margin:18px 0 0;padding:0;list-style:none}
.file{
  display:grid;
  grid-template-columns:46px 1fr auto auto;
  align-items:center;
  gap:8px 16px;
  padding:14px 22px;
  border-top:1px solid var(--line);
}
.ext{
  width:46px;height:46px;
  display:grid;place-items:center;
  border-radius:9px;
  background:var(--panel-2);
  border:1px solid var(--line-2);
  color:var(--glow);
  font:700 12px/1 var(--display);
}
.fname{font-weight:600;word-break:break-word;min-width:0}
.fmeta{display:flex;flex-wrap:wrap;gap:0 14px;color:var(--muted);font-size:13px;font-weight:400}
.count{
  text-align:right;
  font-variant-numeric:tabular-nums;
  font-size:14px;
  color:var(--muted);
  white-space:nowrap;
}
.count b{color:var(--text);font-size:17px;font-weight:600}
.actions{display:flex;gap:8px;align-items:center}
.btn{
  appearance:none;
  display:inline-block;
  min-width:116px;
  text-align:center;
  padding:10px 18px;
  background:var(--violet);
  color:#fff;
  font:600 15px/1 var(--body);
  text-decoration:none;
  border:1px solid rgba(196,168,255,.35);
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 0 0 0 rgba(124,58,237,0);
  transition:background .15s,box-shadow .15s;
}
.btn:hover{background:var(--violet-hi);box-shadow:0 0 22px rgba(124,58,237,.55)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.btn.done{background:#1f6f43;border-color:rgba(74,222,128,.4)}
.btn.ghost{
  min-width:0;
  padding:10px 13px;
  background:transparent;
  color:var(--muted);
  border:1px solid var(--line-2);
  font-weight:500;
  font-size:14px;
}
.btn.ghost:hover{color:var(--text);border-color:var(--glow);background:transparent;box-shadow:none}
.btn.ghost.done{color:var(--ok);border-color:rgba(74,222,128,.5);background:transparent}
details.release summary{
  list-style:none;
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:6px 14px;
  padding:18px 22px;
  cursor:pointer;
}
details.release summary::-webkit-details-marker{display:none}
details.release summary:focus-visible{outline:2px solid var(--glow);outline-offset:-2px}
details.release summary h2{margin:0;font:700 18px/1.2 var(--display)}
details.release summary time,details.release summary small{color:var(--muted);font-size:14px}
details.release summary::after{content:"+";margin-left:auto;color:var(--glow);font:600 20px/1 var(--display)}
details.release[open] summary::after{content:"–"}
details.release[open] .files{margin-top:6px}
.state{
  border:1px dashed var(--line-2);
  border-radius:16px;
  padding:30px 22px;
  color:var(--muted);
}
.state strong{display:block;color:var(--text);margin-bottom:4px;font-size:17px}
.skeleton{height:190px;border-radius:16px;border:1px solid var(--line);background:var(--panel);opacity:.7}
footer{margin-top:36px;font-size:14px}
footer a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
footer a:hover{color:var(--glow)}
footer a:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media (max-width:620px){
  header{padding:40px 0 30px}
  .lead{font-size:16px}
  .stat{padding:16px 12px 16px 0}
  .stat + .stat{padding-left:14px}
  .release-head{padding:18px 16px 0}
  .notes{margin:12px 16px 0}
  .file{grid-template-columns:46px 1fr;padding:14px 16px}
  .file .count{grid-column:1 / -1;text-align:left;order:3}
  .file .actions{grid-column:1 / -1;order:4}
  .file .btn:not(.ghost){flex:1}
  details.release summary{padding:16px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" data-lang="en" aria-pressed="true">ENG</button>
    </div>
  </div>

  <header>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <section class="stats">
    <div class="stat"><b id="s-downloads">–</b><span id="l-downloads"></span></div>
    <div class="stat"><b id="s-views">–</b><span id="l-views"></span></div>
    <div class="stat"><b id="s-files">–</b><span id="l-files"></span></div>
  </section>

  <div class="tools" id="tools" hidden>
    <input type="search" id="search" autocomplete="off">
  </div>

  <main id="list" aria-live="polite">
    <div class="skeleton"></div>
  </main>

  <footer><a id="gh" target="_blank" rel="noopener"></a></footer>
</div>

<script>
const CONFIG = {
  repo: "Wasted3551/WASTED-MODS-Mods-Archive-",
  name: "WASTED MODS",
  description: {
    en: "Mods for People Playground. Pick a file and download it.",
    ru: "Моды для People Playground. Выбери файл и скачай."
  },
  cacheMinutes: 1,
  searchFrom: 6,
  goatcounter: ""
};

const I18N = {
  en: {
    locale: "en-US",
    downloads: "downloads",
    views: "views",
    files: "files",
    latest: "latest",
    download: "Download",
    downloading: "Downloading",
    copy: "Copy link",
    copied: "Copied",
    countLabel: "Downloads",
    updated: "Updated",
    search: "Search mods",
    noMatches: "Nothing found",
    noMatchesText: "Try a different name.",
    noFiles: "No files in this release",
    units: { kb: "KB", mb: "MB", gb: "GB" },
    emptyTitle: "No releases yet",
    emptyText: "Create a release in the repository and attach the archives.",
    errRepoTitle: "Repository not found",
    errRepoText: "Check the repo value in CONFIG and make sure the repository is public.",
    errLimitTitle: "Too many requests",
    errLimitText: "GitHub has temporarily limited requests. Refresh the page in a few minutes.",
    errHttpTitle: "Could not load files",
    errHttpText: "Check your connection and refresh the page.",
    filesIn: "Files",
    github: "View on GitHub"
  },
  ru: {
    locale: "ru-RU",
    downloads: "скачиваний",
    views: "просмотров",
    files: "файлов",
    latest: "последняя",
    download: "Скачать",
    downloading: "Скачивается",
    copy: "Копировать ссылку",
    copied: "Скопировано",
    countLabel: "Скачиваний",
    updated: "Обновлён",
    search: "Поиск по модам",
    noMatches: "Ничего не найдено",
    noMatchesText: "Попробуй другое название.",
    noFiles: "В этом релизе нет файлов",
    units: { kb: "КБ", mb: "МБ", gb: "ГБ" },
    emptyTitle: "Релизов пока нет",
    emptyText: "Создай релиз в репозитории и приложи к нему архивы.",
    errRepoTitle: "Репозиторий не найден",
    errRepoText: "Проверь значение repo в CONFIG и что репозиторий публичный.",
    errLimitTitle: "Слишком много запросов",
    errLimitText: "GitHub временно ограничил запросы. Обнови страницу через несколько минут.",
    errHttpTitle: "Не удалось загрузить файлы",
    errHttpText: "Проверь соединение и обнови страницу.",
    filesIn: "Файлов",
    github: "Открыть на GitHub"
  }
};

const $ = id => document.getElementById(id);
const SLUG = CONFIG.repo.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const NS = "dl-" + SLUG;

const state = { status: "loading", error: null, releases: [], views: null, viewsFailed: true, query: "" };
let lang = detectLang();

function detectLang(){
  try {
    const saved = window.localStorage.getItem("lang");
    if (saved === "ru" || saved === "en") return saved;
  } catch (e) {}
  const first = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
  return String(first).toLowerCase().startsWith("ru") ? "ru" : "en";
}

function saveLang(){
  try { window.localStorage.setItem("lang", lang); } catch (e) {}
}

function session(){
  try { return window.sessionStorage; } catch (e) { return null; }
}

function t(){ return I18N[lang]; }
function nf(n){ return new Intl.NumberFormat(t().locale).format(n); }

function fmtSize(bytes){
  const u = t().units;
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " " + u.gb;
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " " + u.mb;
  return Math.max(1, Math.round(bytes / 1024)) + " " + u.kb;
}

function fmtDate(iso){
  return new Date(iso).toLocaleDateString(t().locale, { day: "numeric", month: "short", year: "numeric" });
}

function extOf(name){
  const i = name.lastIndexOf(".");
  return i > 0 && i < name.length - 1 ? name.slice(i) : ".file";
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function stateBox(title, text){
  const box = el("div", "state");
  box.append(el("strong", "", title), document.createTextNode(text));
  return box;
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

function buildFile(a){
  const s = t();
  const li = el("li", "file");
  li.append(el("div", "ext", extOf(a.name)));

  const name = el("div", "fname", a.name);
  const meta = el("div", "fmeta");
  meta.append(el("span", "", fmtSize(a.size)));
  if (a.updated_at) meta.append(el("span", "", s.updated + " " + fmtDate(a.updated_at)));
  name.append(meta);

  const count = el("div", "count");
  const num = el("b", "", nf(a.download_count));
  count.append(document.createTextNode(s.countLabel + ": "), num);

  const actions = el("div", "actions");
  const btn = el("a", "btn", s.download);
  btn.href = a.browser_download_url;
  btn.rel = "noopener";
  btn.addEventListener("click", () => {
    btn.textContent = t().downloading;
    btn.classList.add("done");
    setTimeout(() => {
      btn.textContent = t().download;
      btn.classList.remove("done");
    }, 2500);
  });

  const copy = el("button", "btn ghost", s.copy);
  copy.type = "button";
  copy.addEventListener("click", async () => {
    const ok = await copyText(a.browser_download_url);
    if (!ok) return;
    copy.textContent = t().copied;
    copy.classList.add("done");
    setTimeout(() => {
      copy.textContent = t().copy;
      copy.classList.remove("done");
    }, 1800);
  });

  actions.append(btn, copy);
  li.append(name, count, actions);
  return li;
}

function buildBody(rel, assets, withNotes){
  const frag = document.createDocumentFragment();
  const body = (rel.body || "").trim();
  if (withNotes && body) frag.append(el("p", "notes", body));
  const ul = el("ul", "files");
  if (!assets.length) {
    const li = el("li", "file");
    li.style.gridTemplateColumns = "1fr";
    li.append(el("div", "fname", t().noFiles));
    ul.append(li);
  }
  assets.forEach(a => ul.append(buildFile(a)));
  frag.append(ul);
  return frag;
}

function renderRelease(rel, assets, isLatest, isFirst, open){
  const s = t();
  const title = rel.name || rel.tag_name;
  const date = fmtDate(rel.published_at || rel.created_at);

  if (isFirst) {
    const card = el("article", "release");
    const head = el("div", "release-head");
    head.append(el("h2", "", title));
    if (isLatest) head.append(el("span", "badge", s.latest));
    head.append(el("time", "", date));
    card.append(head, buildBody(rel, assets, true));
    return card;
  }

  const card = el("details", "release");
  if (open) card.open = true;
  const sum = el("summary");
  sum.append(el("h2", "", title), el("time", "", date), el("small", "", s.filesIn + ": " + (rel.assets || []).length));
  card.append(sum, buildBody(rel, assets, true));
  return card;
}

function totalFiles(){
  return state.releases.reduce((n, r) => n + (r.assets || []).length, 0);
}

function renderStats(){
  const s = t();
  $("l-downloads").textContent = s.downloads;
  $("l-views").textContent = s.views;
  $("l-files").textContent = s.files;

  if (state.status === "ok") {
    let dl = 0;
    state.releases.forEach(r => (r.assets || []).forEach(a => { dl += a.download_count; }));
    $("s-downloads").textContent = nf(dl);
    $("s-files").textContent = nf(totalFiles());
  } else if (state.status === "empty") {
    $("s-downloads").textContent = "0";
    $("s-files").textContent = "0";
  } else {
    $("s-downloads").textContent = "–";
    $("s-files").textContent = "–";
  }
  $("s-views").parentElement.hidden = state.viewsFailed;
  $("s-views").textContent = state.views === null ? "–" : nf(state.views);
}

function renderList(){
  const s = t();
  const list = $("list");
  list.replaceChildren();

  if (state.status === "loading") {
    list.append(el("div", "skeleton"));
    return;
  }
  if (state.status === "empty") {
    list.append(stateBox(s.emptyTitle, s.emptyText));
    return;
  }
  if (state.status === "error") {
    if (state.error === "repo") list.append(stateBox(s.errRepoTitle, s.errRepoText));
    else if (state.error === "limit") list.append(stateBox(s.errLimitTitle, s.errLimitText));
    else list.append(stateBox(s.errHttpTitle, s.errHttpText));
    return;
  }

  const q = state.query.trim().toLowerCase();
  const groups = state.releases
    .map((rel, i) => ({
      rel,
      latest: i === 0,
      assets: (rel.assets || []).filter(a => !q || a.name.toLowerCase().includes(q))
    }))
    .filter(g => !q || g.assets.length);

  if (!groups.length) {
    list.append(stateBox(s.noMatches, s.noMatchesText));
    return;
  }
  groups.forEach((g, i) => list.append(renderRelease(g.rel, g.assets, g.latest, i === 0, !!q)));
}

function renderTools(){
  const show = state.status === "ok" && totalFiles() > CONFIG.searchFrom;
  $("tools").hidden = !show;
  $("search").placeholder = t().search;
  $("search").setAttribute("aria-label", t().search);
}

function renderStatic(){
  document.documentElement.lang = lang;
  document.title = CONFIG.name;
  $("title").textContent = CONFIG.name;
  $("lead").textContent = CONFIG.description[lang];
  const gh = $("gh");
  gh.href = "https://github.com/" + CONFIG.repo;
  gh.textContent = t().github;
  document.querySelectorAll(".lang button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
}

function render(){
  renderStatic();
  renderStats();
  renderTools();
  renderList();
}

document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    saveLang();
    render();
  });
});

$("search").addEventListener("input", e => {
  state.query = e.target.value;
  renderList();
});

async function getReleases(){
  const key = "rel:" + CONFIG.repo;
  const s = session();
  if (s) {
    const raw = s.getItem(key);
    if (raw) {
      const c = JSON.parse(raw);
      if (Date.now() - c.t < CONFIG.cacheMinutes * 60000) return c.d;
    }
  }
  const r = await fetch("https://api.github.com/repos/" + CONFIG.repo + "/releases?per_page=30", {
    headers: { Accept: "application/vnd.github+json" }
  });
  if (r.status === 404) throw new Error("repo");
  if (r.status === 403 || r.status === 429) throw new Error("limit");
  if (!r.ok) throw new Error("http");
  const data = await r.json();
  if (s) s.setItem(key, JSON.stringify({ t: Date.now(), d: data }));
  return data;
}

async function loadReleases(){
  try {
    const all = (await getReleases()).filter(r => !r.draft);
    state.releases = all;
    state.status = all.length ? "ok" : "empty";
  } catch (e) {
    state.status = "error";
    state.error = e.message;
  }
  render();
}

async function loadViews(){
  const s = session();
  const counted = s && s.getItem("viewed");
  const url = "https://api.counterapi.dev/v1/" + NS + "/views/" + (counted ? "" : "up");
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error();
    const d = await r.json();
    const n = [d.count, d.value, d.data && d.data.up_count].find(v => typeof v === "number");
    if (n === undefined) throw new Error();
    if (s) s.setItem("viewed", "1");
    state.views = n;
    state.viewsFailed = false;
  } catch (e) {
    state.views = null;
    state.viewsFailed = true;
  }
  renderStats();
}

if (CONFIG.goatcounter) {
  const gc = document.createElement("script");
  gc.async = true;
  gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = "https://" + CONFIG.goatcounter + ".goatcounter.com/count";
  document.head.append(gc);
}

render();
loadReleases();
loadViews();
</script>
</body>
</html>
